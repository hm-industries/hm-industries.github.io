<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamid Metal Industries — Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#080b0f;color:#f5f7fa;margin:0}.wrap{max-width:900px;margin:auto;padding:25px}
.card{background:#11161d;border:1px solid #27303b;border-radius:16px;padding:22px;margin-bottom:18px}
input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #27303b}input{width:100%;box-sizing:border-box;background:#0b0f14;color:#fff;margin:7px 0 12px}
button{cursor:pointer;background:#d8a84e;border-color:#d8a84e;font-weight:700}.secondary{background:#171d25;color:#fff;border-color:#27303b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{display:flex;gap:12px;align-items:center;border-top:1px solid #27303b;padding:12px 0}.item img{width:90px;height:70px;object-fit:cover;border-radius:8px}.muted{color:#aab3bf;font-size:13px}
.hidden{display:none}@media(max-width:650px){.row{grid-template-columns:1fr}.item{align-items:flex-start}}
</style></head>
<body><div class="wrap">
<h1>Hamid Metal Industries — Admin</h1>
<div id="login" class="card"><h2>Admin Login</h2><p class="muted">Only the authenticated admin can manage website photos.</p>
<label>Email</label><input id="email" type="email" value="by.hmindustries@gmail.com" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button onclick="login()">Login</button><p id="msg" class="muted"></p></div>

<div id="panel" class="hidden">
<div class="card"><button class="secondary" onclick="logout()">Logout</button>
<h2>Add work photo</h2><div class="row"><div><label>Photo URL</label><input id="url" placeholder="Paste an image URL"></div>
<div><label>Title</label><input id="title" placeholder="e.g. SS Railing"></div></div>
<button onclick="addPhoto()">Add Photo</button><p class="muted">For a first version, use an image URL. Storage upload can be added later.</p></div>
<div class="card"><h2>Current Gallery</h2><div id="list"></div></div>
</div></div>
<script>
const SUPABASE_URL="YOUR_SUPABASE_URL", SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
let token=null;
async function api(path,opts={}){opts.headers={...(opts.headers||{}),apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token||SUPABASE_ANON_KEY}`};return fetch(SUPABASE_URL+path,opts)}
async function login(){
 const email=document.getElementById("email").value,password=document.getElementById("password").value;
 const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
 const d=await r.json(); if(d.access_token){token=d.access_token;sessionStorage.setItem("hmi_admin_token",token);showPanel();}else document.getElementById("msg").textContent=d.error_description||"Login failed";
}
function logout(){token=null;sessionStorage.removeItem("hmi_admin_token");location.reload()}
function showPanel(){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");load()}
async function load(){const r=await api("/rest/v1/gallery?select=id,title,image_url,sort_order&order=sort_order.asc");const rows=await r.json();document.getElementById("list").innerHTML=rows.map(x=>`<div class="item"><img src="${x.image_url}"><div style="flex:1"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.image_url)}</span></div><button onclick="del('${x.id}')">Delete</button></div>`).join("")||'<p class="muted">No photos yet.</p>'}
async function addPhoto(){const title=document.getElementById("title").value.trim(),image_url=document.getElementById("url").value.trim();if(!title||!image_url)return alert("Title and image URL required.");await api("/rest/v1/gallery",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({title,image_url,sort_order:Date.now()})});document.getElementById("title").value="";document.getElementById("url").value="";load()}
async function del(id){if(!confirm("Delete this photo?"))return;await api("/rest/v1/gallery?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{"Prefer":"return=minimal"}});load()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
token=sessionStorage.getItem("hmi_admin_token");if(token)showPanel();
</script></body></html>
